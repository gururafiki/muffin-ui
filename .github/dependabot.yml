# Dependabot configuration.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Each ecosystem groups minor+patch into a single PR. Ungrouped, the weekly batch
# here is large enough that it gets reviewed in bulk — which is how a deliberate
# safety bound got widened unreviewed in muffin-agent#145.
#
# No `gradle` ecosystem: `android/` is generated by `expo prebuild` and is not
# tracked in git, so there is no committed manifest to update.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Expo pins the versions of its own SDK packages that work together, and
      # `expo install` / `expo-doctor` is what resolves them. Bumping react /
      # react-native / expo-* individually against an SDK release is how you get
      # a build that compiles and then fails at runtime — upgrade the SDK as a
      # unit instead (see the expo-upgrade flow in ROADMAP.md).
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      # Not covered by "expo-*" — the name does not start with "expo", but the
      # package is versioned in lockstep with the SDK major all the same.
      # Dependabot opened #35 to take 57.0.1 against Expo SDK 56; the lint
      # config for an SDK we are not on is exactly the mismatch this list
      # exists to prevent.
      - dependency-name: "eslint-config-expo"
      - dependency-name: "@expo/*"
      # eslint and typescript MAJORS are SDK-coupled too, because
      # eslint-config-expo owns the toolchain underneath them and no released
      # version supports the next major of either:
      #   eslint 10   -> eslint-plugin-react@7.37.5 (latest) peers on
      #                  `eslint: ... || ^9.7`. It has no eslint 10 support at
      #                  all, and it arrives via eslint-config-expo. #34 died on
      #                  `Error while loading rule 'react/display-name'`.
      #   typescript 7 -> @typescript-eslint/typescript-estree@8.66.0 (latest)
      #                  peers on `typescript: >=4.8.4 <6.1.0`. TS 7 is the
      #                  native port and typescript-eslint reads TS internals;
      #                  #36 died on `Cannot read properties of undefined
      #                  (reading 'Intrinsic')` inside `eslint .`, while
      #                  `tsc --noEmit` itself passed.
      # Both move with the SDK upgrade, as a set. Minor/patch flow normally.
      # tailwindcss is owned by NativeWind, which compiles it for React Native.
      # nativewind@4.2.6 (the current `latest`) hard-refuses v4 —
      # `expo export` dies on "NativeWind only supports Tailwind CSS v3" and
      # produces nothing. Tailwind v4 needs NativeWind v5, which is published
      # only as 5.0.0-preview.4. Moving the whole styling system onto an
      # unreleased major is a project, not a bump; it lands when v5 is stable.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Node major bumps are chosen by LTS line, not by version number, and
      # Dependabot has no concept of release lines. It proposed 25 (#30), then
      # 26 (#44) — both Current releases (`lts: false` on nodejs.org/dist) with
      # ~6 months of support, i.e. each one moves a production image OFF
      # long-term support. Even majors do become LTS, but months after release,
      # so the next move is a deliberate decision. Minor/patch flow normally.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
