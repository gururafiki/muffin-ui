# Build & push the Muffin web app image (arm64) to GHCR, and build the Android APK.
#
# Builds the Expo web export + nginx image (see Dockerfile) on a native arm64
# runner and pushes it to ghcr.io/<owner>/muffin-ui. The deployment
# (gururafiki/muffin-deployment) pulls this :latest tag onto the Oracle ARM node.
# Mirrors the other image repos in the umbrella (agent-chat-ui-docker, etc.).
#
# The `android` job runs in PARALLEL and never gates the deploy: a broken APK
# build must not stop the web app shipping. It republishes the rolling
# `android-latest` release so the phone download URL never changes.
name: Build image

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/muffin-ui:latest
            ghcr.io/${{ github.repository_owner }}/muffin-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Auto-CD: tell muffin-deployment a fresh image is on GHCR so it redeploys the Swarm stack
      # (deploy.yml listens for repository_dispatch type=deploy). Needs a cross-repo PAT — the
      # built-in GITHUB_TOKEN can't dispatch to another repo.
      - name: Trigger deploy
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          repository: ${{ github.repository_owner }}/muffin-deployment
          event-type: deploy
          client-payload: '{"repo": "${{ github.repository }}", "sha": "${{ github.sha }}"}'

  # Sideloadable Android APK, republished to a rolling release so the phone can
  # always fetch the newest build from one URL:
  #   https://github.com/<owner>/muffin-ui/releases/latest/download/muffin-arm64.apk
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create/replace the release asset
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }   # RN 0.85 needs JDK 17+

      - uses: actions/setup-node@v7
        with: { node-version: '20.19.4', cache: npm }         # Expo SDK 56 minimum

      # Gradle's caches dominate the build time; without this every run is ~20min.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: npm ci

      # `android/` is gitignored — it is prebuild output, regenerated here.
      - run: npx expo prebuild -p android
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Restore upload keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      # arm64 only: every real phone is arm64, and dropping the x86/x86_64 slices
      # (emulator-only) roughly halves the download. Signing is INJECTED rather than
      # patched into the generated build.gradle — AGP's android.injected.signing.*
      # properties are the supported way, so nothing has to edit prebuild output.
      #
      # The connection URLs are baked so the phone opens ready to go. The Cloudflare
      # Access service token is deliberately NOT baked: this release is public, and
      # the APK must not carry a credential for the deployment.
      - name: Build signed release APK
        working-directory: android
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.keystore" \
            -Pandroid.injected.signing.store.password='${{ secrets.ANDROID_KEYSTORE_PASSWORD }}' \
            -Pandroid.injected.signing.key.alias='${{ secrets.ANDROID_KEY_ALIAS }}' \
            -Pandroid.injected.signing.key.password='${{ secrets.ANDROID_KEY_PASSWORD }}'

      - name: Stage the artifact
        id: apk
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk muffin-arm64.apk
          echo "sha256=$(sha256sum muffin-arm64.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h muffin-arm64.apk | cut -f1)" >> "$GITHUB_OUTPUT"

      # ONE RELEASE PER BUILD, tagged by date + commit.
      #
      # The previous rolling release clobbered a single asset in place, which left
      # `publishedAt` frozen at the release's original creation — and that is the
      # field GitHub's list sorts and labels by, so a freshly rebuilt APK still read
      # "17 hours ago" with no way to tell a current build from a stale one.
      #
      # A new release per build fixes that at the source: the date IS the build, every
      # build stays downloadable, and rolling back is just picking an older one. The
      # bookmarkable URL keeps working because `releases/latest/download/<name>`
      # resolves to the newest published release and the asset name is constant:
      #
      #   https://github.com/<owner>/muffin-ui/releases/latest/download/muffin-arm64.apk
      #
      # NOTE: that URL means "newest release of ANY kind". If product/version releases
      # are ever published from this repo, they would take over `latest` and the phone
      # would start downloading the wrong thing — switch to a fixed tag then.
      - name: Publish a release for this build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STAMP=$(date -u +'%Y.%m.%d-%H%M')
          SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="android-$STAMP-$SHORT"
          NOTES=$(printf 'Sideloadable Android build (arm64), one release per push to main.\n\n- commit: %s\n- built: %s\n- size: %s\n- sha256: `%s`\n\nAlways-newest link: https://github.com/%s/releases/latest/download/muffin-arm64.apk\n\nInstall: download the APK on the phone and tap it (allow "install unknown apps").\nThen set the Cloudflare Access client ID + secret in Settings -> Connection and sign in —\nthose are deliberately not baked into a public artifact.' \
            "${{ github.sha }}" "$(date -u +'%Y-%m-%d %H:%M UTC')" "${{ steps.apk.outputs.size }}" "${{ steps.apk.outputs.sha256 }}" "${{ github.repository }}")
          gh release create "$TAG" muffin-arm64.apk \
            --title "Android APK — $(date -u +'%Y-%m-%d %H:%M UTC') ($SHORT)" --notes "$NOTES"

          # Keep the list readable: prune every android-* release past the newest 10.
          # Each carries a ~51 MB asset, so this is about storage as much as tidiness.
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("android-"))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
            | while read -r old; do
                [ -n "$old" ] && gh release delete "$old" --yes --cleanup-tag || true
              done
