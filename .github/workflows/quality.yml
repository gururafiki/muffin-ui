name: Quality

# The merge gate for this repo: `npm run check` = tsc --noEmit, eslint over the
# whole tree (not just expo lint's /src,/app,/components), and the offline
# timeline/skeleton verification scripts.
#
# Before this, build.yml was the only workflow: it builds and pushes the image on
# push-to-main, so nothing checked a pull request at all. A type error or a
# broken timeline reducer could only be discovered after it was already on `main`
# and dispatched to the deployment repo.
#
# NOTE: deliberately NO `paths` / `paths-ignore` filter. This is a REQUIRED
# status check, and a filtered workflow never reports on a PR that misses the
# filter — leaving the PR blocked on a check that will never arrive.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  # Superseded PR pushes are safe to cancel; a `main` commit is not — its result
  # is the record that the merged tree is sound.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Matches build.yml's android job: Expo SDK 56 minimum.
          node-version: "20.19.4"
          cache: npm
      - run: npm ci
      - name: Typecheck, lint, offline verification
        run: npm run check
      # `npm run check` is typecheck + eslint + pure-logic scripts — none of it
      # bundles the app. A PR could therefore make the app completely
      # unbuildable and still go green: Dependabot's tailwindcss 3->4 bump (#46)
      # passed every check while `expo export` died on "NativeWind only supports
      # Tailwind CSS v3" and emitted zero files. Building here is what turns
      # that from a post-merge surprise into a failed check.
      - name: Build the web bundle
        run: npm run build:web
      # BUILDING IS NOT RENDERING. `build:web` proves the bundle compiles; it cannot
      # see a component that mounts and draws nothing, and this repo's two worst UI
      # defects were exactly that. Every skeleton in the app was an invisible
      # zero-height box for WEEKS (the className landed on a Reanimated view, which
      # NativeWind does not style), and the segment Sankey shipped as a 34px-tall
      # empty card. Both compiled perfectly.
      #
      # These two drive real Chrome over the `dist/` just built, serving it locally
      # and MOCKING Supabase — so they need no credentials and no deployment, which
      # is what makes them gate material rather than a live probe. `verify:universe`
      # deliberately stays out: it asserts properties of the DEPLOYED server as anon
      # (server-side filtering, the true total, the 3s statement timeout) and cannot
      # be answered without one. ~15s each.
      - name: Verify the rendered app
        run: |
          npm run verify:skeletons
          npm run verify:market

      # NOTHING HERE HAS EVER EXERCISED A NATIVE PATH ON A PULL REQUEST.
      # `build:web` and the render checks above are Metro's WEB target; the only
      # native build in the repo lives in build.yml, which runs on push-to-main
      # and whose android job "never gates the deploy" by design. So a change
      # could break iOS and Android completely and every PR check would still be
      # green — the same hole the web build was added to close, one platform over.
      #
      # Both steps run on Linux: prebuild only writes files, and `expo export`
      # runs Metro. Neither needs Xcode, a Mac, a device or a secret, which is
      # what makes this gate material rather than a nightly.
      #
      # WHAT IT ACTUALLY CATCHES. `package.json` pins five npm overrides to clear
      # transitive advisories, and three of them are reached ONLY through native
      # tooling: `uuid` (via xcode, which writes project.pbxproj), and
      # `@xmldom/xmldom` twice (via plist, which writes Info.plist). A bad bump
      # there is invisible to the web build. `decode-uri-component` is pinned to
      # 0.5.0 because that is the ONLY version without the DoS advisory, and it
      # is ESM-only while its consumer `query-string` uses require() — which
      # means a bare `node -e "require('query-string')"` throws ERR_REQUIRE_ESM
      # today. Metro transpiles it and every path this app uses is fine (verified
      # 2026-09-06: web static render of 27 pages, web bundle, iOS bundle), but
      # that is a property of the bundler, not a given. Exporting for iOS is what
      # keeps it a checked fact.
      - name: Prebuild the native projects
        run: |
          npx expo prebuild -p ios --no-install
          npx expo prebuild -p android --no-install
      # A prebuild that writes GARBAGE still exits 0, so assert the two files the
      # overridden libraries actually produce: the plist must parse and carry the
      # bundle identifier app.json pins, and the manifest must parse.
      - name: The generated native config must be well-formed
        run: |
          python3 - <<'PY'
          import plistlib, sys, xml.etree.ElementTree as ET
          with open('ios/muffinui/Info.plist', 'rb') as f:
              info = plistlib.load(f)
          # Prebuild writes the identifier as a build-setting reference, so the
          # literal lives in project.pbxproj — assert on that, not on the plist.
          pbx = open('ios/muffinui.xcodeproj/project.pbxproj').read()
          if 'com.gururafiki.muffinui' not in pbx:
              sys.exit('project.pbxproj carries no PRODUCT_BUNDLE_IDENTIFIER for this app — '
                       'an iOS bundle identifier is the app identity, and prebuild INVENTS one '
                       'from the account when app.json does not pin it')
          if not info.get('CFBundleDisplayName'):
              sys.exit('Info.plist has no CFBundleDisplayName — plist/@xmldom/xmldom wrote a '
                       'file that parses and says nothing')
          ET.parse('android/app/src/main/AndroidManifest.xml')
          print('ok  Info.plist, project.pbxproj and AndroidManifest.xml are all well-formed')
          PY
      # The bundle itself. Metro's native resolver is not its web resolver: a
      # module that resolves for web can fail here, which is the whole point.
      - name: Build the native bundle
        run: npx expo export --platform ios --output-dir /tmp/native-bundle
