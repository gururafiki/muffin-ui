# nginx config for the Muffin web app (Expo static export).
#
# Serves the SPA and reverse-proxies /api/* to the internal LangGraph server and
# /supabase/* to the Kong gateway, mirroring agent-chat-ui's same-origin proxy so
# the browser never needs CORS or absolute backend URLs.

# Upgrade websocket connections (Supabase Realtime) but keep keep-alive for
# plain requests. This file lives in conf.d, i.e. inside the http{} context.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Same-origin API proxy → langgraph-api on the overlay network.
    # The trailing slash strips the /api prefix: /api/threads → /threads.
    location /api/ {
        proxy_pass http://langgraph-api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass Cloudflare Access identity through to the agent auth hook.
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;

        # Streaming (SSE) needs buffering off and long-lived connections.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Same-origin Supabase proxy → the Kong gateway on the overlay network.
    # The trailing slash strips the /supabase prefix. Realtime runs over
    # websockets, hence the Upgrade/Connection wiring.
    location /supabase/ {
        proxy_pass http://supabase-kong:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Deployment runtime config (written from env at container start). Never
    # cache it, so a redeploy / key rotation propagates on the next load.
    location = /runtime-config.js {
        add_header Cache-Control "no-store";
        default_type application/javascript;
    }

    # Static assets + SPA fallback (dynamic routes hydrate client-side).
    location / {
        try_files $uri $uri.html /index.html;
    }
}
